<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KMZ GIS Viewer</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
    />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <div id="app">
      <header class="toolbar">
        <div class="toolbar-group">
          <button id="btn-open" class="btn" type="button" title="Open KMZ or KML">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="currentColor"
                d="M10 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"
              />
            </svg>
            Open
          </button>
          <input
            id="file-input"
            class="file-input"
            type="file"
            accept=".kmz,.kml,application/vnd.google-earth.kmz,application/vnd.google-earth.kml+xml"
            tabindex="-1"
            aria-hidden="true"
          />
        </div>

        <div class="toolbar-basemap-group">
          <div class="toolbar-coords" aria-live="polite" title="Cursor position on the map (WGS84)">
            <span class="toolbar-coords-label">Coordinates</span>
            <span id="toolbar-coords" class="toolbar-coords-value">—</span>
          </div>
          <label class="basemap-label">
            Basemap
            <select id="basemap-select" title="Basemap">
              <option value="osm">OpenStreetMap</option>
              <option value="satellite" selected>Esri Satellite</option>
              <option value="topo">Esri Topo</option>
            </select>
          </label>
        </div>

        <div class="toolbar-sep"></div>

        <div class="toolbar-group tool-toggle" role="group" aria-label="Map tools">
          <button id="tool-pan" class="btn btn-tool active" type="button" data-tool="pan" title="Pan (P)">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="currentColor"
                d="M13 1v8.6l2.2-2.2 1.4 1.4L12 14.4 7.4 8.8l1.4-1.4L11 9.6V1h2zm-1 16.6 4.6-5.6 1.5 1.2L13 20.2V23h-2v-2.8L5.9 13.2l1.5-1.2L12 17.6z"
              />
            </svg>
            Pan
          </button>
          <button
            id="tool-distance"
            class="btn btn-tool"
            type="button"
            data-tool="distance"
            title="Measure distance (D)"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="currentColor"
                d="M3 7h2v2H3V7zm4 0h2v2H7V7zm4 0h2v2h-2V7zm4 0h2v2h-2V7zm4 0h2v2h-2V7zM3 15h18v2H3v-2zm2-6h14v4H5V9z"
              />
            </svg>
            Distance
          </button>
          <button
            id="tool-area"
            class="btn btn-tool"
            type="button"
            data-tool="area"
            title="Measure area (A)"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="currentColor"
                d="M3 5h8v4H3V5zm10 0h8v14h-8V5zM3 11h8v8H3v-8z"
              />
            </svg>
            Area
          </button>
          <button id="btn-clear" class="btn" type="button" title="Clear measurements (C)">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="currentColor"
                d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"
              />
            </svg>
            Clear
          </button>
        </div>
      </header>

      <div class="workspace">
        <aside class="sidebar">
          <section class="sidebar-section sidebar-recent">
            <h2>Recent</h2>
            <div id="recent-files" class="recent-files" aria-label="Recent KMZ files">
              <p class="muted">No recent files</p>
            </div>
          </section>

          <section class="sidebar-section">
            <h2>File</h2>
            <p id="file-label" class="muted">No file loaded</p>
            <div class="file-actions">
              <button
                type="button"
                class="btn"
                id="file-save-copy"
                disabled
                title="Save a timestamped copy in the same folder as the original file"
              >
                Save copy
              </button>
            </div>
          </section>

          <section class="sidebar-section sidebar-layers">
            <h2>Layers</h2>
            <div class="layer-toolbar" role="toolbar" aria-label="Layer actions">
              <div class="layer-toolbar-group" role="group" aria-label="All layers">
                <button type="button" class="layer-toolbar-btn" id="layers-all" disabled title="Show all layers">
                  All
                </button>
                <button type="button" class="layer-toolbar-btn" id="layers-none" disabled title="Hide all layers">
                  None
                </button>
              </div>
              <div class="layer-toolbar-group" role="group" aria-label="Folders">
                <button type="button" class="layer-toolbar-btn" id="layers-expand" disabled title="Expand all folders">
                  Expand
                </button>
                <button type="button" class="layer-toolbar-btn" id="layers-collapse" disabled title="Collapse all folders">
                  Collapse
                </button>
              </div>
              <div class="layer-toolbar-group" role="group" aria-label="Edit layers">
                <button type="button" class="layer-toolbar-btn layer-toolbar-icon" id="layers-sort" disabled title="Sort by name" aria-label="Sort by name">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path
                      fill="currentColor"
                      d="M3 18h6v-2H3v2zM3 6v2h18V6H3zm0 7h12v-2H3v2z"
                    />
                  </svg>
                </button>
                <button type="button" class="layer-toolbar-btn layer-toolbar-icon" id="layers-copy" disabled title="Copy (Ctrl+C)" aria-label="Copy">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path
                      fill="currentColor"
                      d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"
                    />
                  </svg>
                </button>
                <button type="button" class="layer-toolbar-btn layer-toolbar-icon" id="layers-cut" disabled title="Cut (Ctrl+X)" aria-label="Cut">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path
                      fill="currentColor"
                      d="M9.64 7.64c.23-.5.36-1.05.36-1.64 0-2.21-1.79-4-4-4S2 3.79 2 6s1.79 4 4 4c.59 0 1.14-.13 1.64-.36L10 12l-2.36 2.36C7.14 14.13 6.59 14 6 14c-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4c0-.59-.13-1.14-.36-1.64L12 14l7 7h3v-1L9.64 7.64zM6 8c-1.1 0-2-.89-2-2s.9-2 2-2 2 .89 2 2-.9 2-2 2zm0 12c-1.1 0-2-.89-2-2s.9-2 2-2 2 .89 2 2-.9 2-2 2zM19 3l-6 6 2 2 7-7V3h-3z"
                    />
                  </svg>
                </button>
                <button type="button" class="layer-toolbar-btn layer-toolbar-icon" id="layers-paste" disabled title="Paste (Ctrl+V)" aria-label="Paste">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path
                      fill="currentColor"
                      d="M19 2h-4.18C14.4.84 13.3 0 12 0c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm7 18H5V4h2v3h10V4h2v16z"
                    />
                  </svg>
                </button>
                <button type="button" class="layer-toolbar-btn layer-toolbar-icon" id="layers-delete" disabled title="Delete (Del)" aria-label="Delete">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path
                      fill="currentColor"
                      d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"
                    />
                  </svg>
                </button>
                <button type="button" class="layer-toolbar-btn layer-toolbar-icon" id="layers-rename" disabled title="Rename focused layer (F2)" aria-label="Rename">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path
                      fill="currentColor"
                      d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"
                    />
                  </svg>
                </button>
              </div>
              <div class="layer-toolbar-group" role="group" aria-label="Selected visibility">
                <button type="button" class="layer-toolbar-btn layer-toolbar-icon" id="layers-show" disabled title="Show selected" aria-label="Show selected">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path
                      fill="currentColor"
                      d="M12 5C7 5 2.7 8.1 1 12c1.7 3.9 6 7 11 7s9.3-3.1 11-7c-1.7-3.9-6-7-11-7zm0 11.5A4.5 4.5 0 1 1 12 7.5a4.5 4.5 0 0 1 0 9z"
                    />
                    <path fill="currentColor" d="M12 10.2a1.8 1.8 0 1 0 .01 0z" />
                  </svg>
                </button>
                <button type="button" class="layer-toolbar-btn layer-toolbar-icon" id="layers-hide" disabled title="Hide selected" aria-label="Hide selected">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path
                      fill="currentColor"
                      opacity=".4"
                      d="M12 5C7 5 2.7 8.1 1 12c1.7 3.9 6 7 11 7s9.3-3.1 11-7c-1.7-3.9-6-7-11-7zm0 11.5A4.5 4.5 0 1 1 12 7.5a4.5 4.5 0 0 1 0 9z"
                    />
                    <path
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      d="M5 5l14 14"
                    />
                  </svg>
                </button>
              </div>
            </div>
            <div id="layer-tree" class="layer-tree" role="tree" aria-multiselectable="true">
              <p class="muted empty-hint">Open a KMZ or KML file to see folders and features.</p>
            </div>
          </section>

          <section class="sidebar-section sidebar-inspect">
            <h2>Inspect</h2>
            <div id="inspect-panel" class="inspect-panel">
              <p class="muted">Click a feature on the map.</p>
            </div>
          </section>
        </aside>

        <main class="map-wrap">
          <div id="map"></div>
          <div id="route-card" class="route-card hidden">
            <div id="route-card-title" class="route-card-title"></div>
            <div id="route-card-meta" class="route-card-meta"></div>
            <div class="route-card-actions">
              <a id="route-google" class="btn" href="#" target="_blank" rel="noopener noreferrer">Google Maps</a>
              <button id="route-clear" class="btn" type="button">Clear route</button>
            </div>
          </div>
          <div id="drop-overlay" class="drop-overlay hidden" aria-hidden="true">
            <div class="drop-card">Drop KMZ or KML to open</div>
          </div>
        </main>
      </div>

      <footer class="statusbar">
        <span id="status-tool">Tool: Pan</span>
        <span class="status-sep"></span>
        <span id="status-measure">No measurement</span>
        <span id="status-message" class="status-message"></span>
      </footer>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.2.4/purify.min.js"></script>
    <script src="js/kml-parse.js"></script>
    <script src="js/recent-files.js"></script>
    <script src="js/kmz-loader.js"></script>
    <script src="js/kmz-save.js"></script>
    <script src="js/map.js"></script>
    <script src="js/measure.js"></script>
    <script src="js/directions.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
