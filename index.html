<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KMZ GIS Viewer</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"
    />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <div id="app">
      <header class="toolbar">
        <div class="toolbar-brand">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              fill="currentColor"
              d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5z"
            />
          </svg>
          <span>KMZ GIS Viewer</span>
        </div>

        <div class="toolbar-group">
          <button id="btn-open" class="btn" type="button" title="Open KMZ or KML">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="currentColor"
                d="M10 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"
              />
            </svg>
            Open
          </button>
          <input
            id="file-input"
            type="file"
            accept=".kmz,.kml,application/vnd.google-earth.kmz,application/vnd.google-earth.kml+xml"
            hidden
          />
        </div>

        <div class="toolbar-sep"></div>

        <div class="toolbar-group tool-toggle" role="group" aria-label="Map tools">
          <button id="tool-pan" class="btn btn-tool active" type="button" data-tool="pan" title="Pan (P)">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="currentColor"
                d="M13 1v8.6l2.2-2.2 1.4 1.4L12 14.4 7.4 8.8l1.4-1.4L11 9.6V1h2zm-1 16.6 4.6-5.6 1.5 1.2L13 20.2V23h-2v-2.8L5.9 13.2l1.5-1.2L12 17.6z"
              />
            </svg>
            Pan
          </button>
          <button
            id="tool-distance"
            class="btn btn-tool"
            type="button"
            data-tool="distance"
            title="Measure distance (D)"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="currentColor"
                d="M3 7h2v2H3V7zm4 0h2v2H7V7zm4 0h2v2h-2V7zm4 0h2v2h-2V7zm4 0h2v2h-2V7zM3 15h18v2H3v-2zm2-6h14v4H5V9z"
              />
            </svg>
            Distance
          </button>
          <button
            id="tool-area"
            class="btn btn-tool"
            type="button"
            data-tool="area"
            title="Measure area (A)"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="currentColor"
                d="M3 5h8v4H3V5zm10 0h8v14h-8V5zM3 11h8v8H3v-8z"
              />
            </svg>
            Area
          </button>
          <button id="btn-clear" class="btn" type="button" title="Clear measurements (C)">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="currentColor"
                d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"
              />
            </svg>
            Clear
          </button>
        </div>

        <div class="toolbar-sep"></div>

        <label class="basemap-label">
          Basemap
          <select id="basemap-select" title="Basemap">
            <option value="osm">OpenStreetMap</option>
            <option value="satellite">Esri Satellite</option>
            <option value="topo">Esri Topo</option>
          </select>
        </label>
      </header>

      <div class="workspace">
        <aside class="sidebar">
          <section class="sidebar-section">
            <h2>File</h2>
            <p id="file-label" class="muted">No file loaded</p>
          </section>

          <section class="sidebar-section sidebar-layers">
            <h2>Layers</h2>
            <div id="layer-tree" class="layer-tree">
              <p class="muted empty-hint">Open a KMZ or KML file to see folders and features.</p>
            </div>
          </section>

          <section class="sidebar-section sidebar-inspect">
            <h2>Inspect</h2>
            <div id="inspect-panel" class="inspect-panel">
              <p class="muted">Click a feature on the map.</p>
            </div>
          </section>
        </aside>

        <main class="map-wrap">
          <div id="map"></div>
          <div id="route-card" class="route-card hidden">
            <div id="route-card-title" class="route-card-title"></div>
            <div id="route-card-meta" class="route-card-meta"></div>
            <div class="route-card-actions">
              <a id="route-google" class="btn" href="#" target="_blank" rel="noopener noreferrer">Google Maps</a>
              <button id="route-clear" class="btn" type="button">Clear route</button>
            </div>
          </div>
          <div id="drop-overlay" class="drop-overlay hidden" aria-hidden="true">
            <div class="drop-card">Drop KMZ or KML to open</div>
          </div>
        </main>
      </div>

      <footer class="statusbar">
        <span id="status-coords">—</span>
        <span class="status-sep"></span>
        <span id="status-tool">Tool: Pan</span>
        <span class="status-sep"></span>
        <span id="status-measure">No measurement</span>
        <span id="status-message" class="status-message"></span>
      </footer>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.2.4/purify.min.js"></script>
    <script src="js/kml-parse.js"></script>
    <script src="js/kmz-loader.js"></script>
    <script src="js/map.js"></script>
    <script src="js/measure.js"></script>
    <script src="js/directions.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
